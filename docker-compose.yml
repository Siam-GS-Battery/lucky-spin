services:
  app:
    build: .
    ports:
      - "8787:8787"
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8787/healthz > /dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
